# Netlify build settings. The Next.js runtime is detected and installed by
# Netlify itself — nothing to add to package.json.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next 15 needs 18.18+; match what the project is developed against.
  NODE_VERSION = "22"

  # Netlify's secret scanner string-matches every env value against the build
  # output, and these five are *meant* to be visible:
  #   SHOP_NAME / SHOP_PHONE            printed on every page and message
  #   CLOUDINARY_UPLOAD_FOLDER          a folder name; also matches the package name
  #   NEXT_PUBLIC_*                     inlined into the browser bundle by design
  #   NEXTAUTH_URL / NEXT_PUBLIC_APP_URL the site's own public address
  #
  # Scanning stays ON for everything else, which is the point: MONGODB_URI,
  # AUTH_SECRET, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET and CRON_SECRET are
  # still checked, and were verified absent from the build output.
  SECRETS_SCAN_OMIT_KEYS = "SHOP_NAME,SHOP_PHONE,CLOUDINARY_UPLOAD_FOLDER,NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME,NEXT_PUBLIC_APP_URL,NEXTAUTH_URL,MESSAGING_PROVIDER"

# Netlify's scheduled functions cannot call a Next.js route handler directly,
# so /api/cron/reminders is triggered externally (cron-job.org) with the
# CRON_SECRET bearer token the route already checks. vercel.json's cron block
# is ignored here and kept only for a future move back to Vercel.
